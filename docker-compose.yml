version: '3.8'


services:
  servidor-web:
    build: .
    container_name: mi-web-compose
    ports:
      - "8080:80"
    depends_on:
      - base-datos

  base-datos:
    image: postgres:15-alpine
    container_name: mi-db-compose
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
